<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 40" width="420" height="40" role="img" aria-labelledby="title desc">
  <title id="title">Terminal prompt — dark theme</title>
  <desc id="desc">Terminal-style prompt with a blinking cursor.</desc>
  <style>
    text {
      fill: #3FB950;
      font-family: "Courier New", "Liberation Mono", monospace;
      font-size: 24px;
      font-weight: 800;
    }
    .cursor { animation: blink 1.05s steps(1, end) infinite; }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; opacity: 1; }
    }
  </style>
  <text x="10" y="28">meraj@github:~$ <tspan class="cursor">█</tspan></text>
</svg>
