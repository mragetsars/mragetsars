<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 534 533"
     width="534"
     height="533"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Meraj Rastegar binary logo — dark theme</title>
  <desc id="desc">A vector logo built from binary digits.</desc>

  <style>
    .row {
      fill: #3FB950;
      font-family: "Courier New", "Liberation Mono", monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 8.8px;
      animation: reveal .55s ease-out both;
    }

  .r0 { animation-delay: 0.000s; }
  .r1 { animation-delay: 0.035s; }
  .r2 { animation-delay: 0.070s; }
  .r3 { animation-delay: 0.105s; }
  .r4 { animation-delay: 0.140s; }
  .r5 { animation-delay: 0.175s; }
  .r6 { animation-delay: 0.210s; }
  .r7 { animation-delay: 0.245s; }
  .r8 { animation-delay: 0.280s; }
  .r9 { animation-delay: 0.315s; }
  .r10 { animation-delay: 0.350s; }
  .r11 { animation-delay: 0.385s; }
  .r12 { animation-delay: 0.420s; }
  .r13 { animation-delay: 0.455s; }
  .r14 { animation-delay: 0.490s; }
  .r15 { animation-delay: 0.525s; }
  .r16 { animation-delay: 0.560s; }
  .r17 { animation-delay: 0.595s; }
  .r18 { animation-delay: 0.630s; }
  .r19 { animation-delay: 0.665s; }
  .r20 { animation-delay: 0.700s; }
  .r21 { animation-delay: 0.735s; }
  .r22 { animation-delay: 0.770s; }
  .r23 { animation-delay: 0.805s; }
  .r24 { animation-delay: 0.840s; }
  .r25 { animation-delay: 0.875s; }
  .r26 { animation-delay: 0.910s; }
  .r27 { animation-delay: 0.945s; }
  .r28 { animation-delay: 0.980s; }
  .r29 { animation-delay: 1.015s; }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(3px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .row { animation: none; }
    }
  </style>

  <text x="8" y="43" class="row r0" xml:space="preserve">        0                0000</text>
  <text x="8" y="59" class="row r1" xml:space="preserve">       101            101010000</text>
